<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pads &amp; Tanpura - New &amp; Old</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="tool-page pads-page">
        <header class="tool-page-header pads-header">
            <button type="button" class="tool-page-back" id="toolPageBack" title="Back to New &amp; Old" aria-label="Back to New &amp; Old">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </button>
            <div class="pads-title-group">
                <h1><i class="fas fa-guitar" aria-hidden="true"></i> Pads &amp; Tanpura</h1>
                <p class="pads-subtitle">Select a key, then play an atmosphere pad or tanpura drone</p>
            </div>
            <button type="button" class="metronome-menu-btn" id="padsInfoBtn" title="Info" aria-label="Info">
                <i class="fas fa-info-circle" aria-hidden="true"></i>
            </button>
        </header>

        <main class="tool-page-container pads-container">
            <div class="pads-section-heading">
                <span>1. Select Key</span>
                <span class="pads-current-key-pill"><span id="padsCurrentKeyLabel">C</span> (current)</span>
            </div>
            <div class="pads-key-selector" id="padsKeySelector"></div>

            <div class="pads-section-heading">
                <span>2. Choose Sound</span>
            </div>
            <div class="pads-pad-row">
                <button type="button" class="pads-pad-btn pads-pad-atmosphere" id="padAtmosphere">
                    <i class="fas fa-cloud pads-pad-icon" aria-hidden="true"></i>
                    <span class="pads-pad-label">Atmosphere Pad</span>
                    <span class="pads-pad-subtitle">Ambient background pad</span>
                    <span class="pads-pad-play-circle"><i class="fas fa-play" aria-hidden="true"></i></span>
                    <span class="pads-pad-state">Tap to Play</span>
                </button>
                <button type="button" class="pads-pad-btn pads-pad-tanpura" id="padTanpura">
                    <i class="fas fa-guitar pads-pad-icon" aria-hidden="true"></i>
                    <span class="pads-pad-label">Tanpura</span>
                    <span class="pads-pad-subtitle">Traditional drone</span>
                    <span class="pads-pad-play-circle"><i class="fas fa-play" aria-hidden="true"></i></span>
                    <span class="pads-pad-state">Tap to Play</span>
                </button>
            </div>

            <p class="pads-availability-hint" id="padsAvailabilityHint"></p>

            <div class="pads-volume-row">
                <label for="padsVolume"><i class="fas fa-volume-up" aria-hidden="true"></i> Volume</label>
                <input type="range" id="padsVolume" min="0" max="100" value="50" title="Pads Volume">
                <span class="pads-volume-value" id="padsVolumeValue">50%</span>
            </div>

            <div class="tune-pitch-info-box pads-tip-box">
                <i class="fas fa-lightbulb" aria-hidden="true"></i>
                <span>Tip: Select a key, then play either the pad or tanpura. Use the volume slider to adjust the level.</span>
            </div>
        </main>
    </div>

    <nav class="mobile-modern-shell" id="mobileModernShell" aria-label="Primary mobile navigation">
        <button class="mobile-modern-nav-item" type="button" data-tool-nav-back="true" aria-label="Home">
            <i class="fas fa-home" aria-hidden="true"></i>
            <span>Home</span>
        </button>
        <button class="mobile-modern-nav-item" type="button" data-tool-nav-back="true" aria-label="Songs">
            <i class="fas fa-music" aria-hidden="true"></i>
            <span>Songs</span>
        </button>
        <button class="mobile-modern-nav-item" type="button" data-tool-nav-back="true" aria-label="Setlist">
            <i class="fas fa-list" aria-hidden="true"></i>
            <span>Setlist</span>
        </button>
        <button class="mobile-modern-nav-item mobile-modern-nav-more active" id="mobileToolsToggle" type="button" aria-label="More tools" aria-expanded="false">
            <i class="fas fa-angle-double-right" aria-hidden="true"></i>
            <span>More</span>
        </button>
    </nav>
    <div class="mobile-tools-menu" id="mobileToolsMenu" aria-hidden="true">
        <a class="mobile-tools-item" href="tuner.html">
            <i class="fas fa-music" aria-hidden="true"></i>
            <span>Tuner</span>
        </a>
        <a class="mobile-tools-item" href="pads-tanpura.html">
            <i class="fas fa-drum" aria-hidden="true"></i>
            <span>Pads &amp; Tanpura</span>
        </a>
        <a class="mobile-tools-item" href="metronome.html">
            <i class="fas fa-drum-steelpan" aria-hidden="true"></i>
            <span>Metronome</span>
        </a>
    </div>

    <script src="scripts/core/api-base.js"></script>
    <script src="loop-player-pad.js"></script>
    <script src="pads-tanpura.js"></script>
</body>
</html>
