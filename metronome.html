<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome - New &amp; Old</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="tool-page metronome-page">
        <header class="tool-page-header">
            <button type="button" class="tool-page-back" id="toolPageBack" title="Back to New &amp; Old" aria-label="Back to New &amp; Old">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </button>
            <h1><i class="fas fa-drum-steelpan" aria-hidden="true"></i> Metronome</h1>
            <button type="button" class="metronome-menu-btn" id="metronomeMenuBtn" title="More" aria-label="More">
                <i class="fas fa-ellipsis-v" aria-hidden="true"></i>
            </button>
        </header>

        <main class="tool-page-container metronome-container">
            <div class="metronome-eyebrow">PRACTICE TOOL</div>
            <p class="metronome-subtitle">Set your tempo or tap it in</p>

            <section class="metronome-card metronome-tempo-card">
                <div class="metronome-card-label">TEMPO</div>
                <div class="metronome-tempo-display">
                    <span class="metronome-bpm" id="metronomeBpm">96</span>
                    <span class="metronome-bpm-unit">BPM</span>
                </div>
                <div class="metronome-tempo-controls">
                    <button type="button" class="metronome-round-btn" id="metronomeMinus" aria-label="Decrease tempo">
                        <i class="fas fa-minus" aria-hidden="true"></i>
                    </button>
                    <input type="range" id="metronomeSlider" class="metronome-slider" min="40" max="220" value="96">
                    <button type="button" class="metronome-round-btn" id="metronomePlus" aria-label="Increase tempo">
                        <i class="fas fa-plus" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="metronome-range-labels">
                    <span>40</span>
                    <span>220</span>
                </div>
            </section>

            <section class="metronome-card metronome-tap-card">
                <div class="metronome-card-title">TAP TEMPO</div>
                <p class="metronome-tap-subtitle">Tap to find the BPM</p>
                <button type="button" class="metronome-tap-btn" id="metronomeTapBtn">TAP &bull; TAP &bull; TAP</button>
            </section>

            <div class="metronome-action-row">
                <button type="button" class="metronome-action-btn" id="metronomeStartBtn">
                    <i class="fas fa-play" aria-hidden="true"></i>
                    <span>Start</span>
                </button>
                <button type="button" class="metronome-action-btn" id="metronomeAccentBtn">
                    <i class="fas fa-music" aria-hidden="true"></i>
                    <span>Accent</span>
                </button>
                <button type="button" class="metronome-action-btn" id="metronomeResetBtn">
                    <i class="fas fa-undo" aria-hidden="true"></i>
                    <span>Reset</span>
                </button>
            </div>

            <div class="metronome-eyebrow metronome-section-label">METER &amp; FEEL</div>
            <div class="metronome-select-row">
                <div class="metronome-select-group">
                    <label for="metronomeTimeSignature">Time Signature</label>
                    <select id="metronomeTimeSignature">
                        <option value="4">4 / 4</option>
                        <option value="3">3 / 4</option>
                        <option value="2">2 / 4</option>
                        <option value="6">6 / 8</option>
                    </select>
                </div>
                <div class="metronome-select-group">
                    <label for="metronomeSubdivision">Subdivision</label>
                    <select id="metronomeSubdivision">
                        <option value="1">Quarter</option>
                        <option value="2">Eighth</option>
                        <option value="3">Triplet</option>
                        <option value="4">Sixteenth</option>
                    </select>
                </div>
            </div>

            <div class="metronome-eyebrow metronome-section-label">QUICK TEMPOS</div>
            <div class="metronome-quick-row" id="metronomeQuickTempos">
                <button type="button" class="metronome-quick-btn" data-bpm="70">70</button>
                <button type="button" class="metronome-quick-btn" data-bpm="80">80</button>
                <button type="button" class="metronome-quick-btn" data-bpm="96">96</button>
                <button type="button" class="metronome-quick-btn" data-bpm="110">110</button>
            </div>
        </main>
    </div>

    <nav class="mobile-modern-shell" id="mobileModernShell" aria-label="Primary mobile navigation">
        <button class="mobile-modern-nav-item" type="button" data-tool-nav-back="true" aria-label="Home">
            <i class="fas fa-home" aria-hidden="true"></i>
            <span>Home</span>
        </button>
        <button class="mobile-modern-nav-item" type="button" data-tool-nav-back="true" aria-label="Songs">
            <i class="fas fa-music" aria-hidden="true"></i>
            <span>Songs</span>
        </button>
        <button class="mobile-modern-nav-item" type="button" data-tool-nav-back="true" aria-label="Setlist">
            <i class="fas fa-list" aria-hidden="true"></i>
            <span>Setlist</span>
        </button>
        <button class="mobile-modern-nav-item mobile-modern-nav-more active" id="mobileToolsToggle" type="button" aria-label="More tools" aria-expanded="false">
            <i class="fas fa-angle-double-right" aria-hidden="true"></i>
            <span>More</span>
        </button>
    </nav>
    <div class="mobile-tools-menu" id="mobileToolsMenu" aria-hidden="true">
        <a class="mobile-tools-item" href="tuner.html">
            <i class="fas fa-music" aria-hidden="true"></i>
            <span>Tuner</span>
        </a>
        <a class="mobile-tools-item" href="pads-tanpura.html">
            <i class="fas fa-drum" aria-hidden="true"></i>
            <span>Pads &amp; Tanpura</span>
        </a>
        <a class="mobile-tools-item" href="metronome.html">
            <i class="fas fa-drum-steelpan" aria-hidden="true"></i>
            <span>Metronome</span>
        </a>
    </div>

    <script src="metronome.js"></script>
</body>
</html>
